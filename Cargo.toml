[package]
name = "descramble"
version = "0.1.1"
edition = "2024"
default-run = "descramble"

[[bin]]
name = "descramble-gui"
path = "src/bin/descramble-gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
color-eyre = "0.6.5"
iced = {
  version = "0.14.0",
  features = ["canvas", "fira-sans", "image-without-codecs", "tokio"],
  optional = true,
}
# Explicit image allocation is not re-exported by Iced's image-without-codecs feature.
iced_runtime = { version = "0.14.0", optional = true }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
num = "0.4.3"
radiate = { version = "=1.3.1", features = ["rayon", "serde"] }
rand = "0.10.3"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[features]
default = ["gui"]

gui = [
  "dep:iced",
  "dep:iced_runtime",
]
