name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: descramble-gui

jobs:
  # ---------------------------------------------------------------------------
  # Validate release
  # ---------------------------------------------------------------------------

  validate:
    name: Validate release
    runs-on: ubuntu-22.04

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          VERSION="$(
            cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "descramble") | .version'
          )"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match Cargo.toml version 'v${VERSION}'"
            exit 1
          fi

      - name: Check application icon
        shell: bash
        run: |
          if [[ ! -f assets/descramble.png ]]; then
            echo "::error::Missing assets/descramble.png"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Linux AppImage
  # ---------------------------------------------------------------------------

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-22.04

    env:
      TARGET: x86_64-unknown-linux-gnu
      OUTPUT: descramble-gui-linux-x86_64.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install --yes \
            libfuse2 \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            pkg-config

      - name: Build
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --bin "$BINARY_NAME" \
            --features gui \
            --target "$TARGET"

      - name: Create desktop entry
        shell: bash
        run: |
          cat > descramble.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Descramble
          Comment=Image descrambling application
          Exec=descramble-gui
          Icon=descramble
          Categories=Graphics;Utility;
          Terminal=false
          EOF

      - name: Download linuxdeploy
        shell: bash
        run: |
          curl \
            --fail \
            --location \
            --output linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage

          chmod +x linuxdeploy.AppImage

      - name: Create AppImage
        shell: bash
        env:
          LDAI_OUTPUT: ${{ env.OUTPUT }}
          LDAI_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ./linuxdeploy.AppImage \
            --appdir AppDir \
            --executable "target/${TARGET}/release/${BINARY_NAME}" \
            --desktop-file descramble.desktop \
            --icon-file assets/descramble.png \
            --output appimage

          chmod +x "$OUTPUT"

          echo "Created:"
          file "$OUTPUT"
          ls -lh "$OUTPUT"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Windows executable
  # ---------------------------------------------------------------------------

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-2025

    env:
      TARGET: x86_64-pc-windows-msvc
      OUTPUT: descramble-gui-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: |
          cargo build `
            --release `
            --locked `
            --bin $env:BINARY_NAME `
            --features gui `
            --target $env:TARGET

      - name: Prepare executable
        shell: pwsh
        run: |
          Copy-Item `
            "target\$env:TARGET\release\$env:BINARY_NAME.exe" `
            $env:OUTPUT

          Get-Item $env:OUTPUT

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # macOS universal DMG
  # ---------------------------------------------------------------------------

  macos:
    name: macOS Universal
    needs: validate
    runs-on: macos-15

    env:
      ARM_TARGET: aarch64-apple-darwin
      X86_TARGET: x86_64-apple-darwin

      APP_NAME: Descramble
      BUNDLE_ID: io.github.${{ github.repository_owner }}.descramble

      OUTPUT: descramble-gui-macos-universal.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Apple Silicon
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --bin "$BINARY_NAME" \
            --features gui \
            --target "$ARM_TARGET"

      - name: Build Intel
        shell: bash
        run: |
          cargo build \
            --release \
            --locked \
            --bin "$BINARY_NAME" \
            --features gui \
            --target "$X86_TARGET"

      - name: Create universal executable
        shell: bash
        run: |
          mkdir -p dist

          lipo \
            -create \
            "target/${ARM_TARGET}/release/${BINARY_NAME}" \
            "target/${X86_TARGET}/release/${BINARY_NAME}" \
            -output "dist/${BINARY_NAME}"

          chmod +x "dist/${BINARY_NAME}"

          echo "Architectures:"
          lipo -archs "dist/${BINARY_NAME}"

          echo "Executable:"
          file "dist/${BINARY_NAME}"

      # -----------------------------------------------------------------------
      # macOS icon
      # -----------------------------------------------------------------------

      - name: Create macOS icon
        shell: bash
        run: |
          ICONSET="dist/Descramble.iconset"

          mkdir -p "$ICONSET"

          sips -z 16 16 \
            assets/descramble.png \
            --out "$ICONSET/icon_16x16.png"

          sips -z 32 32 \
            assets/descramble.png \
            --out "$ICONSET/icon_16x16@2x.png"

          sips -z 32 32 \
            assets/descramble.png \
            --out "$ICONSET/icon_32x32.png"

          sips -z 64 64 \
            assets/descramble.png \
            --out "$ICONSET/icon_32x32@2x.png"

          sips -z 128 128 \
            assets/descramble.png \
            --out "$ICONSET/icon_128x128.png"

          sips -z 256 256 \
            assets/descramble.png \
            --out "$ICONSET/icon_128x128@2x.png"

          sips -z 256 256 \
            assets/descramble.png \
            --out "$ICONSET/icon_256x256.png"

          sips -z 512 512 \
            assets/descramble.png \
            --out "$ICONSET/icon_256x256@2x.png"

          sips -z 512 512 \
            assets/descramble.png \
            --out "$ICONSET/icon_512x512.png"

          sips -z 1024 1024 \
            assets/descramble.png \
            --out "$ICONSET/icon_512x512@2x.png"

          iconutil \
            --convert icns \
            --output dist/Descramble.icns \
            "$ICONSET"

      # -----------------------------------------------------------------------
      # .app bundle
      # -----------------------------------------------------------------------

      - name: Create application bundle
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          APP="dist/${APP_NAME}.app"

          mkdir -p \
            "${APP}/Contents/MacOS" \
            "${APP}/Contents/Resources"

          cp \
            "dist/${BINARY_NAME}" \
            "${APP}/Contents/MacOS/${BINARY_NAME}"

          cp \
            dist/Descramble.icns \
            "${APP}/Contents/Resources/Descramble.icns"

          chmod +x \
            "${APP}/Contents/MacOS/${BINARY_NAME}"

          cat > "${APP}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>${APP_NAME}</string>

              <key>CFBundleExecutable</key>
              <string>${BINARY_NAME}</string>

              <key>CFBundleIconFile</key>
              <string>Descramble.icns</string>

              <key>CFBundleIdentifier</key>
              <string>${BUNDLE_ID}</string>

              <key>CFBundleName</key>
              <string>${APP_NAME}</string>

              <key>CFBundlePackageType</key>
              <string>APPL</string>

              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>

              <key>CFBundleVersion</key>
              <string>${VERSION}</string>

              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF

          plutil -lint "${APP}/Contents/Info.plist"

      # We do not have a paid Apple Developer certificate.
      # This gives the bundle a valid ad-hoc code signature but does not
      # notarize the application or identify the developer to Gatekeeper.
      - name: Ad-hoc sign application
        shell: bash
        run: |
          codesign \
            --force \
            --sign - \
            "dist/${APP_NAME}.app"

          codesign \
            --verify \
            --strict \
            --verbose=2 \
            "dist/${APP_NAME}.app"

      # -----------------------------------------------------------------------
      # DMG
      # -----------------------------------------------------------------------

      - name: Create DMG
        shell: bash
        run: |
          mkdir -p dist/dmg

          cp -R \
            "dist/${APP_NAME}.app" \
            dist/dmg/

          ln -s \
            /Applications \
            dist/dmg/Applications

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder dist/dmg \
            -format UDZO \
            -ov \
            "${OUTPUT}"

          echo "Created:"
          hdiutil imageinfo "${OUTPUT}"
          ls -lh "${OUTPUT}"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: ${{ env.OUTPUT }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # GitHub Release
  # ---------------------------------------------------------------------------

  release:
    name: Publish GitHub Release

    needs:
      - validate
      - linux
      - windows
      - macos

    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Show release files
        shell: bash
        run: |
          ls -lh release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/descramble-gui-linux-x86_64.AppImage
            release/descramble-gui-windows-x86_64.exe
            release/descramble-gui-macos-universal.dmg
